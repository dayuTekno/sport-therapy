name: clinic-database

services:
  clinic-postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-db_clinic}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localhost}
    ports:
      # Terikat hanya ke 127.0.0.1 di port 5433 (TIDAK menyentuh port 5432 production & tidak terbuka ke publik)
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # Nama volume spesifik dan unik, tidak akan menimpa volume docker lain
      - clinic_rstbdi_pgdata:/var/lib/postgresql/data
    networks:
      - clinic_isolated_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-db_clinic}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clinic_rstbdi_pgdata:
    name: clinic_rstbdi_pgdata

networks:
  clinic_isolated_network:
    name: clinic_isolated_network
    driver: bridge
